<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>极速多功能格式转换器 - 离线私密无服务器</title>
    
    <!-- PWA & Web App Manifest -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/svg+xml" href="./pwa-icon.svg" />
    <meta name="theme-color" content="#4f46e5" />
    
    <!-- iOS Web App Specific Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="格式转换" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="./apple-touch-icon-precomposed.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    
    <!-- DNS Prefetch for Fast CDN in China -->
    <link rel="dns-prefetch" href="https://registry.npmmirror.com" />
    <link rel="preconnect" href="https://registry.npmmirror.com" crossorigin />

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
  </head>
  <body class="bg-[#090d14] text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root">
      <div style="min-height: 100vh; background-color: #090d14; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, #6366f1, #4338ca); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 16V4M7 4L3 8M7 4L11 8M17 8V20M17 20L21 16M17 20L13 16"/>
          </svg>
        </div>
        <div style="font-size: 15px; font-weight: 600; color: #ffffff; letter-spacing: -0.025em; margin-bottom: 6px;">Convert Studio</div>
        <div style="font-size: 11px; color: #71717a;">正在本地极速加载...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
